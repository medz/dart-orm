name: orm
description: Typed relational data access for Dart, from declaration to migration.
version: 0.1.0-dev.1
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  analyzer: ^14.1.0
  build: ^4.0.11
  crypto: ^3.0.7
  dart_style: ^3.1.13
  path: ^1.9.1
  postgres: ^3.5.12
  sqlite3: ^3.6.0
  web: ^1.1.1
dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  lints: ^6.1.0
  test: ^1.31.2
executables:
  orm:
flutter:
  assets:
    - path: assets/sqlite/
      platforms: [web]
