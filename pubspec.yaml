name: orm
description: Typed relational data access for Dart, from declaration to migration.
version: 6.0.0-beta.4
repository: https://github.com/medz/dart-orm
issue_tracker: https://github.com/medz/dart-orm/issues
documentation: https://github.com/medz/dart-orm/tree/main/doc
topics:
  - orm
  - database
  - sqlite
  - postgresql
  - mysql
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  analyzer: ^14.1.0
  build: ^4.0.11
  crypto: ^3.0.7
  dart_style: ^3.1.13
  glob: ^2.2.0
  meta: ^1.19.0
  mysql_client_plus: ^0.1.3
  path: ^1.9.1
  postgres: ^3.5.12
  sqlite3: ^3.6.0
  web: ^1.1.1
dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  lints: ^6.1.0
  test: ^1.31.2
executables:
  orm:
flutter:
  assets:
    - path: assets/sqlite/
      platforms: [web]
