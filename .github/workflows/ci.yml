name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dart, SQLite and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orm
          POSTGRES_PASSWORD: orm
          POSTGRES_DB: orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=orm --dbname=orm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ORM_TEST_POSTGRES_HOST: 127.0.0.1
      ORM_TEST_POSTGRES_PORT: 5432
      ORM_TEST_POSTGRES_USER: orm
      ORM_TEST_POSTGRES_PASSWORD: orm
      ORM_TEST_POSTGRES_DATABASE: orm_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - name: Install dependencies
        run: dart pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed bin lib test tool example
      - name: Analyze
        run: dart analyze
      - name: Check generated sources
        run: dart run bin/orm.dart generate --schema example/models.dart --out example/models.db.dart --name AppDatabase --engine sqlite --check
      - name: Test real databases and module boundaries
        run: dart test --concurrency=1
      - name: Run complete business example
        run: dart run example/main.dart
      - name: Validate public API documentation
        run: dart doc --validate-links
      - name: Validate release package
        if: startsWith(github.head_ref, 'release/')
        run: dart pub publish --dry-run
